name: Build Uni-OS VirtualBox ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'cmd/**'
      - 'boot/**'
      - '.github/workflows/build-vbox.yml'
      - 'Makefile'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            cpio curl xz-utils bzip2 grub-pc-bin grub-efi-amd64-bin \
            grub-common xorriso

      - name: Build bootable Uni-OS ISO
        run: |
          chmod +x scripts/*.sh cmd/*
          ./scripts/build-bootable.sh

      - name: Upload VirtualBox ISO
        uses: actions/upload-artifact@v4
        with:
          name: uni-os-vbox-iso
          path: out/uni-os-vbox.iso
          if-no-files-found: error
          retention-days: 14
